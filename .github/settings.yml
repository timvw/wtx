# Repository configuration for timvw/wtx.
#
# This repository is managed by the "Settings" GitHub App (repository-settings).
# https://github.com/apps/settings
#
# The App applies this file automatically on every push to the default branch.
# It is the source of truth for every setting declared below: changes made by
# hand in the GitHub web UI WILL BE REVERTED on the next reconciliation. To
# change a setting, change it here and open a pull request.
#
# Settings not declared in this file are left untouched by the App.
#
# Automation credentials: the `timvw-ci-bot` GitHub App is installed on this
# repository. Automated workflows that need to open or update pull requests, or
# publish check results, mint a short-lived installation token from that App
# (App ID + private key -> installation token, e.g. via
# actions/create-github-app-token). Do not add a long-lived personal access
# token as a repository secret.

repository:
  name: wtx
  description: wtx
  private: false

  # Merge behaviour: squash only, so main stays linear and one PR is one commit.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

  # Optional features, declared explicitly rather than left at GitHub defaults.
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: false

# Branch protection for the default branch.
#
# ALL FOUR of `required_status_checks`, `enforce_admins`,
# `required_pull_request_reviews` and `restrictions` must be present. The App
# forwards this mapping to PUT /repos/{owner}/{repo}/branches/{branch}/protection,
# where all four are required-but-nullable; omit any one of them and NONE of the
# settings are applied -- silently, in the App's delivery log rather than as a
# failed check. The `null`s below are load-bearing, not leftovers.
#
# The `contexts` list is one half of an interface. The other half is the job
# names in .github/workflows/ci.yml, which carries the same warning: GitHub
# matches required checks by name, so renaming a job there without renaming it
# here leaves a required check that nothing ever reports, and a check that never
# reports blocks every pull request forever. Rename in both files, or not at all.
#
# Topics are still deferred -- they were parked alongside branch protection but
# are unrelated to it, and adding them is not this change's job.

branches:
  - name: main
    protection:
      required_status_checks:
        # false: a branch does not have to be rebased onto the tip of main
        # before merging. `true` would re-run all five checks on every merge
        # that follows another merge, which for a single-contributor repository
        # buys a rare protection at a constant cost. Push-triggered CI on main
        # catches the combination break instead, and the fix is forward.
        strict: false
        # Verbatim from ci.yml, and confirmed against the names a real run
        # reports. The test job is a matrix, so each OS leg reports its own
        # check -- there is no combined "Test" context to require.
        contexts:
          - Lint
          - Test (ubuntu-latest)
          - Test (macos-latest)
          - Test (windows-latest)
          - Cross-compile
      # null: no approving review is required. Tim is the sole maintainer and
      # GitHub does not let an author approve their own pull request, so
      # requiring one review would make every pull request unmergeable except by
      # admin override -- turning the escape hatch into the normal merge path.
      # This becomes a real requirement when a second maintainer appears.
      required_pull_request_reviews: null
      # false: protection is not enforced against administrators. This is a
      # deliberate escape hatch. The likeliest failure here is a required check
      # name that no job reports, whose symptom is that every pull request --
      # including the one that fixes the name -- becomes unmergeable. With
      # `true`, recovery means dismantling the rule in the UI and letting the
      # App fight it back; with `false`, it is one merge past a visible warning.
      enforce_admins: false
      # null: no push allowlist. Push restrictions are organisation-only and are
      # rejected on a user-owned repository; the protection above already stops
      # direct pushes to main, so there is no allowlist to maintain.
      restrictions: null
